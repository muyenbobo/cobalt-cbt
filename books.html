<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobalt — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">
    <div id="app-header"></div>

    <div class="panel">
      <h2>Study library</h2>
      <p class="sub">Search uploaded texts by title or author.</p>

      <form class="search-row" id="search-form">
        <input type="text" id="search-input" placeholder="Search by title or author" />
        <button class="btn btn-ghost" type="submit">Search</button>
      </form>

      <p id="books-loading" class="empty-note">Loading books…</p>
      <p id="books-error" class="error-text hidden"></p>
      <p id="books-empty" class="empty-note hidden">No books found.</p>
      <div id="books-list"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
