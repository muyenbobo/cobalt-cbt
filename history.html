<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobalt — History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">
    <div id="app-header"></div>

    <div class="panel">
      <h2>Past attempts</h2>
      <p class="sub">Every quiz you've submitted, most recent first.</p>

      <p id="history-loading" class="empty-note">Loading history…</p>
      <p id="history-error" class="error-text hidden"></p>
      <p id="history-empty" class="empty-note hidden">No attempts yet — take a quiz to see it here.</p>
      <div id="history-list"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
