<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobalt — Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">
    <div id="app-header"></div>

    <div class="panel">
      <h2>Result</h2>
      <p class="sub" id="result-sub">Here's how this round went.</p>

      <div class="score-hero">
        <span class="quiz-counter">Score</span>
        <p class="big-number" id="result-pct"></p>
        <p style="margin: 0; color: var(--ink-soft);" id="result-detail"></p>
        <p class="stat-line" id="result-time"></p>
        <div class="chip-row" id="result-subjects"></div>
      </div>

      <div class="btn-row">
        <a class="btn btn-gold" href="dashboard.html" style="text-decoration: none;">Back to subjects</a>
        <a class="btn btn-ghost" href="history.html" style="text-decoration: none;">View history</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
