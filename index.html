<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobalt — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">
    <div id="app-header"></div>

    <div class="panel">
      <h2 id="auth-title">Log in</h2>
      <p class="sub" id="auth-sub">Enter your credentials to resume practice.</p>

      <p id="auth-notice" class="notice-box hidden"></p>

      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="johnd" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••" autocomplete="current-password" />

        <p id="login-error" class="error-text hidden"></p>

        <div class="btn-row">
          <button class="btn btn-gold" type="submit" id="login-btn">Log in</button>
        </div>
      </form>

      <form id="register-form" class="hidden" novalidate>
        <label for="first_name">First name</label>
        <input id="first_name" type="text" autocomplete="given-name" />

        <label for="last_name">Last name</label>
        <input id="last_name" type="text" autocomplete="family-name" />

        <label for="dob">Date of birth</label>
        <input id="dob" type="date" />

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

        <label for="reg_username">Username</label>
        <input id="reg_username" type="text" autocomplete="username" />

        <label for="reg_password">Password</label>
        <input id="reg_password" type="password" placeholder="At least 4 characters" autocomplete="new-password" />

        <p id="register-error" class="error-text hidden"></p>

        <div class="btn-row">
          <button class="btn btn-gold" type="submit" id="register-btn">Register</button>
        </div>
      </form>

      <p style="margin-top: 1.25rem; font-size: 0.85rem;">
        <span id="toggle-text">No account yet?</span>
        <button class="link-toggle" type="button" id="toggle-btn">Register</button>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
